<rect width="1080" height="1080" fill="#eef4fb"/>
<rect x="26" y="26" width="1028" height="1028" rx="18" fill="none" stroke="#2f6db5" stroke-width="3"/>
<rect x="26" y="26" width="1028" height="404" rx="18" fill="#b0402c"/>
<rect x="26" y="390" width="1028" height="40" fill="#b0402c"/>
<text x="540" y="150" font-family="Arimo,Arial,Helvetica,sans-serif" font-weight="bold" font-style="normal" font-size="27" fill="#eef4fb" text-anchor="middle" letter-spacing="4">STATE REPRESENTATIVE, 55TH DISTRICT</text>
<rect x="500" y="168" width="80" height="3" fill="#eef4fb"/>
<text x="540" y="250" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="bold" font-style="normal" font-size="66" fill="#eef4fb" text-anchor="middle">Asked twice. No reply.</text>
<g transform="translate(0,84)"><text x="540" y="520" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="normal" font-style="normal" font-size="37" fill="#243246" text-anchor="middle">Steve Weir was sent the question on September 10, at</text>
<text x="540" y="570" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="normal" font-style="normal" font-size="37" fill="#243246" text-anchor="middle">the campaign address on his own SEEC filing. The same</text>
<text x="540" y="620" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="normal" font-style="normal" font-size="37" fill="#243246" text-anchor="middle">letter went to his legislative address, the one his office</text>
<text x="540" y="670" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="normal" font-style="normal" font-size="37" fill="#243246" text-anchor="middle">staffs, because I am one of his constituents.</text>
<text x="540" y="754" font-family="Gelasio,Georgia,'Times New Roman',serif" font-weight="bold" font-style="italic" font-size="40" fill="#14507f" text-anchor="middle">He represents me. I am still waiting.</text></g>
<text x="540" y="1002" font-family="Arimo,Arial,Helvetica,sans-serif" font-weight="normal" font-style="normal" font-size="22" fill="#647284" text-anchor="middle">Status as of September 18, 2026. andoverct.info/reports/ahm/disavowal/</text>
</svg>
