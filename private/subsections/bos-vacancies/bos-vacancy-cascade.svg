<svg viewBox="0 0 680 500" width="680" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>How a Board of Selectmen vacancy is filled under CGS 9-222</title>
  <desc>A vacancy occurs; the remaining selectmen fill it within 30 days; if they do not, the town clerk convenes the same-party elective officers, who fill it by day 60; the appointee is seated; a citizen petition within 15 days can force a special election. No branch produces a forced election on its own.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6a64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="250" y="20" width="180" height="56" rx="8" fill="#ECEAE2" stroke="#A9A79E" stroke-width="1"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Vacancy occurs</text>
  <text x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">notice to Town Clerk</text>

  <line x1="340" y1="76" x2="340" y2="112" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="230" y="116" width="220" height="56" rx="8" fill="#E4EFE7" stroke="#2f6b4f" stroke-width="1"/>
  <text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#173f2b">Remaining members fill</text>
  <text x="340" y="155" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D4E">no full quorum needed</text>

  <text x="332" y="240" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">if filled</text>
  <line x1="340" y1="172" x2="340" y2="308" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M450 150 L535 150 L535 210" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="430" y="214" width="210" height="56" rx="8" fill="#FBEED6" stroke="#b5871f" stroke-width="1"/>
  <text x="535" y="236" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#6b4e0a">Party officers fill</text>
  <text x="535" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8a6a17">if selectmen don't act</text>

  <path d="M535 270 L535 340 L442 340" fill="none" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="312" width="200" height="56" rx="8" fill="#ECEAE2" stroke="#A9A79E" stroke-width="1"/>
  <text x="340" y="334" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Appointee seated</text>
  <text x="340" y="351" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">serves unexpired term</text>

  <line x1="340" y1="368" x2="340" y2="404" stroke="#6b6a64" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="220" y="408" width="240" height="56" rx="8" fill="#F4E4E0" stroke="#8C3A2B" stroke-width="1.4"/>
  <text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5c2115">Petition forces election</text>
  <text x="340" y="447" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8C3A2B">~120 signatures, 15 days</text>
</svg>
