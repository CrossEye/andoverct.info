id: 1077
title: >-
  Board of Finance meeting, October 27, 2021 -- the board's liaison
  assignments, and a request from the selectmen
description: >-
  Two things of record at the October 27, 2021 Board of Finance meeting.
  Reaching the standing item for liaison reports, the presiding member said "I
  think typically the only liaison committees we have are the community center
  and also CIP" (~2:27:13): the finance board had no liaison to the Andover
  Board of Education. Separately, in open discussion, the presiding member
  reported that the Board of Selectmen had asked the finance board to have a
  representative available for discussions of theirs that might go into
  executive session, and the board agreed.
