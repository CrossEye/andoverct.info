id: 1023
title: >-
  Board of Education meeting, November 12, 2025 -- the superintendent's
  refusal, and its legal basis
description: >-
  At the same meeting the superintendent explained on the record why the four-
  spreadsheet request could not be filled. Under FERPA, student financial
  records, including tuition payment records and who has or has not paid, are
  protected. Under Connecticut's freedom of information statute, confidential
  student records are withheld. And which staff are enrolled in the town
  insurance plan, what coverage they have, whom they insure and whether they
  decline it, is protected employee information. She stated the re-
  identification problem directly: even listing students by number, adding
  town of residence and tuition paid, set against the small size of the
  classes, makes individual children identifiable.
