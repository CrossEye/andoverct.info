id: 1098
title: >-
  Freedom of Information Act request, July 13, 2026
description: >-
  A request for records under the Connecticut Freedom of Information Act,
  submitted to the Town of Andover on July 13, 2026, seeking all documents and
  communications "concerning any proposed, contemplated, or implemented change
  to the method, schedule, or amount by which the Town funds the Andover
  Elementary School operating budget or the Andover Public School Operating
  Account." The Town's records response of July 16, 2026 is at
  https://andoverct.info/reference/docs/records-production-2026-07-16.pdf.
url: https://andoverct.info/reference/docs/FOIA-request-AES-funding-2026-07-13.pdf
