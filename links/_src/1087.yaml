id: 1087
title: >-
  Email from the First Selectman, July 1, 2026 -- a revised funding process
  for the Andover Elementary School operating budget
description: >-
  The July 1, 2026, 11:02 AM email from First Selectman Jeff Maguire to Board
  of Education chair Caitlin Greenhouse, copied to Board of Finance chair
  Robert England and blind-copied to the Town Treasurer and the Town
  Administrator, announcing that effective July 1, 2026 the Town would be
  implementing a revised funding process for the AES operating budget. States
  its purposes as strengthening cash management, maximizing the investment of
  Town funds, and eliminating reconciliation issues identified during the
  Town's annual audit. States that the Town "has deposited" $100,000 into the
  Andover Public School Operating Account (M&T Bank, account number redacted),
  effective July 2, 2026, to initiate the new process, and sets out the
  replacement mechanism: the AES business manager submits weekly check
  registers and payroll registers, reviewed and approved, to the Town
  Treasurer, Assistant Treasurer and Town Administrator; the Town then
  transfers funds equal to the approved disbursements; the business manager
  prepares a monthly reconciliation; and the Treasurer ensures cumulative
  funding does not exceed the approved operating budget. Produced in the
  Town's July 16, 2026 records response, production pages 12-13.
