id: 1042
title: >-
  Board of Education meeting, November 13, 2024 -- the school board cannot
  locate its own capital fund
description: >-
  At the November 13, 2024 Board of Education meeting the board reported that
  it could not get a clear account of the AES Capital Fund. A member said she
  went to the town treasurer in person and then by email, copying both heads
  of the Board of Finance, and was told the fund "was not located in the
  town's stiff account" -- although, having reviewed the recordings of finance
  board and selectmen's meetings, "in those meetings it was stated that that
  was where said fund was going to be located" (~49:02). The school's
  statements showed accounts under other names, but nothing titled the AES
  Capital Fund (~50:04). On further inquiry the treasurer replied that the
  fund was a stand-alone fund with its own bank account, that the town had
  funded it for $100,000 for the 2024-25 fiscal year as listed in the town
  budget, but that "the funds have not been transferred yet into the separate
  bank account."
