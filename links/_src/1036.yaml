id: 1036
title: >-
  Board of Selectmen meeting, March 10, 2025 -- the First Selectman moves to
  add the town to the school's solar agreement
description: >-
  At the March 10, 2025 Board of Selectmen meeting, under the item on solar at
  the elementary school, First Selectman Jeff Maguire, presiding, objected
  that the power purchase agreement "was signed by the Board of Education
  already, which it shouldn't have been, so there has to be some amendment to
  that contract," and said he would request that something be drafted with the
  town attorney so the town could be brought into the agreement (~1:12:40). He
  framed the project as carrying a liability the town must control: "there is
  a capital liability on this, so we need to put a dollar number on it," and
  noted the cancellation penalties were high (~1:14:15).
