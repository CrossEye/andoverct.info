id: 1078
title: >-
  Special town meeting, September 28, 2021 -- a candidate describes serving as
  the finance board's liaison to the regional school board
description: >-
  Nominated from the floor for a vacant Region 8 (RHAM) Board of Education
  seat, a candidate described his prior town service: four budget cycles on
  the Board of Finance, during part of which "I was liaison to the RHAM Board
  of Education," sitting in on teacher contract negotiations, plus three years
  on the capital improvement committee (~1:20:07, ~1:22:07). The liaison he
  describes is to the regional board, not to the Andover Board of Education.
url: https://andoverct.info/reference/video/transcripts/Tkdj8Dj-Eq8.html
date: 2021-09-28
