id: 1014
title: >-
  Board of Finance minutes, July 23, 2025 -- FY2025-26 levy schedule accepted,
  7-0
description: >-
  The minutes of the July 23, 2025 Board of Finance meeting, carried in the
  following month's packet, record the item as "Levy Schedule for AES Payments
  -- proposed schedule provided in packet, 10 equal payments from July to
  April." The motion to accept the schedule as presented was made by board
  chair Robert England, seconded, and carried 7-0-0. It is the vote behind the
  schedule and figures in the July 23 packet.
