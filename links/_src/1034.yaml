id: 1034
title: >-
  Board of Education meeting, May 14, 2025 -- the superintendent explains how
  the school receives its money
description: >-
  At the May 14, 2025 Board of Education meeting the superintendent gave a
  detailed public account of how the elementary school receives and spends its
  money, in response to a newspaper insert that had made claims about the
  school's finances. She said the school's separate bank account and monthly
  allowance were established at the First Selectman's request: he asked her to
  open a separate account for the school, and the town would give it an
  allowance, as it does for the regional district (~20:47). She described the
  mechanics as an electronic transfer of about $434,000 in ten payments, July
  through April, with none in May or June. In the same meeting she set out the
  preschool's out-of-town admissions logic: a room the school is running
  anyway has empty seats, an out-of-town child cannot be placed here for
  special education, and such a child pays full tuition (~1:24:32).
