id: 1037
title: >-
  Special town meeting, March 13, 2025 -- voters add the Town of Andover as a
  party to the school's solar agreement
description: >-
  At the March 13, 2025 special town meeting the sole substantive item was the
  rooftop solar project at Andover Elementary. The resolution approved the
  project subject to a second amendment to the power purchase agreement whose
  terms "shall include at a minimum the addition of the town of Andover to the
  agreement," together with preservation of the roof warranty and a fair-
  market-value buyout (~51:30). It passed 53 to 24 (~1:28:15). Asked directly
  whether any other town is also a signer on a school's power purchase
  agreement, the solar company's representative said he had never seen it
  (~47:25).
