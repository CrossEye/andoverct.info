id: 1092
title: >-
  Town-wide mailer signed Jeffrey J Maguire, before the May 26, 2026 budget
  referendum -- the per-student arithmetic
description: >-
  A single-page letter mailed to every Andover address, arriving May 20, 2026,
  six days before the second budget referendum. It opens with a personal
  introduction: twenty-five years in Andover, a University of Connecticut
  accounting degree and CPA, a wife who taught public school for twenty-four
  years and served on the Andover Board of Education, children through the
  local schools. It states that in roughly twenty-five town budget referendums
  he had voted against only one school budget before last year, and that he
  voted NO last year and intends to again. It sets the FY 2026-2027 proposed
  budget ($5,013,651) against FY 2023-2024 audited expenses ($3,789,152), a
  $1,224,499 increase, against a K-6 enrollment rise of 15 students, and
  derives approximately $81,633 per additional student. It urges a NO vote on
  May 26. Signed Jeffrey J Maguire, with "Paid For by Jeffery J Maguire" at
  the foot. Nothing on the letter identifies the writer as First Selectman.
