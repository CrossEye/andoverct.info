id: 1056
title: >-
  Board of Education budget workshops, January 2024 -- how out-of-town
  preschool seats are filled
description: >-
  At the January 17, 2024 Board of Education budget workshop the
  superintendent set out the preschool arithmetic: the third preschool
  classroom was added because Andover's own enrollment required it, and out-
  of-town children are admitted afterwards, to fill what is left. "If we had
  unused slots that were available to our extended program, we could fill them
  with out of towners, and those out of towners would be full tuition rate"
  (~40:36-41:28). At the January 24 workshop the board confirmed the program's
  cost structure: the preschool sits outside the general fund, funded by
  school readiness money, Smart Start money and tuition.
