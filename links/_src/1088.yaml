id: 1088
title: >-
  Email from the First Selectman, July 2, 2026 -- the distinct roles of the
  Town's boards, in response to the Board of Education chair
description: >-
  First Selectman Jeff Maguire's July 2, 2026, 3:35 PM email, responding to
  Board of Education chair Caitlin Greenhouse's objection of the evening
  before and sent to the full distribution her reply had assembled: all three
  boards and town staff, about nineteen addresses. It sets out his account of
  the three boards' responsibilities: the Board of Education manages the
  school district's operations within the budget approved for it and
  "determines how those appropriated funds are spent"; the Board of Finance
  develops the budget, recommends appropriations and establishes the tax rate;
  the Board of Selectmen is responsible for the overall administration of Town
  government, including the prudent management of Town assets and cash
  resources. Of the funding process: "It is not intended to control or
  influence how the Board of Education spends its approved budget. The Board
  of Education will continue to have full authority over its expenditures."
  Attaches the AES account summary and the school operating account's M&T
  statements, account numbers redacted by hand. Produced in the Town's July
  16, 2026 records response, production pages 16-26.
