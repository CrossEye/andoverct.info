title: Where Weir Sits in the House
description: >-
  A W-NOMINATE analysis of every recorded House vote of the current term,
  placing all members on a common ideological scale. Weir ranks 11th most
  conservative in the chamber, in a district with roughly a nine-point
  Democratic lean. Includes the downloadable roll-call matrix behind the
  analysis.
