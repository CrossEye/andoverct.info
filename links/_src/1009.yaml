id: 1009
title: >-
  HHS and Department of Education joint guidance on FERPA and HIPAA (2019)
description: >-
  The federal agencies' joint guidance establishing the boundary between the
  two regimes: HIPAA's definition of protected health information excludes
  records covered by FERPA, so a student's school health record falls under
  one regime rather than both.
url: https://www.hhs.gov/sites/default/files/2019-hipaa-ferpa-joint-guidance.pdf
date: 2019-12-01
