id: 1093
title: >-
  Town-wide mailer signed Jeffrey J Maguire, before the June 16, 2026 budget
  referendum -- "increases of 6.0% or more are simply not sustainable"
description: >-
  A single-page letter mailed to every Andover address, arriving June 12,
  2026, four days before the third budget referendum. It recites the two
  defeats to date: May 5, a 10.91% increase ($498,190), rejected 451 NO to 331
  YES; May 26, 9.82% ($448,190), rejected 432 NO to 343 YES. Of the third
  proposal, a 6.0% increase ($273,928), it says the reduction "does not appear
  to be the result of a comprehensive review of expenditures" but "an attempt
  to identify a percentage increase that voters may accept," and argues that
  "annual budget increases of 6.0% or more are simply not sustainable over the
  long term." It notes a resident petition asking the Board of Finance to
  consider limiting the increase to 3.5%, states "Voting NO is not a vote
  against education," and urges a NO vote on June 16. Signed Jeffrey J
  Maguire, with "Paid For by Jeffery J Maguire" at the foot. Nothing on the
  letter identifies the writer as First Selectman.
