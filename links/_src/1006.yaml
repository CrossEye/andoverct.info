id: 1006
title: >-
  Connecticut FOIA, Conn. Gen. Stat. 1-214 -- objection to disclosure
description: >-
  The Connecticut Freedom of Information Act provision governing public
  employees' personnel, medical and similar files, and the process by which
  disclosure that would constitute an invasion of personal privacy may be
  objected to. It is the state-law basis on which a district withholds benefit
  detail that would identify individual employees.
url: https://portal.ct.gov/foi/regulations/the-foi-act/sec-1214--formerly-sec-120a--public-employment-contracts-as-public-record--objection-to-disclosure-o
date: 2026-07-10
