id: 1091
title: >-
  Town-wide mailer signed Jeffrey J Maguire, before the May 5, 2026 budget
  referendum -- the preschool subsidy question
description: >-
  A single-page letter mailed to every Andover address ("POSTAL PATRON,
  ANDOVER CT 06232", presorted marketing mail), arriving in the days before
  the May 5, 2026 budget referendum. Addressed to "Andover Taxpayers," it asks
  whether taxpayers are subsidizing the elementary school's Pre-K program,
  cites 67 enrolled students and 14 out-of-town students at the school,
  reasons from a $6,000 maximum tuition to a combined revenue ceiling of
  roughly $402,000, and calls on the Board of Education to publish a full
  accounting of the program's revenues and expenses. It closes: "I will be
  voting NO at the town budget referendum on May 5th." Signed Jeffrey J
  Maguire; the foot of the page carries "Paid For by Jeffery J Maguire."
  Nothing on the letter identifies the writer as First Selectman.
