id: 1030
title: >-
  Board of Selectmen special meeting, June 26, 2025 -- the town approves the
  second amendment to the solar agreement
description: >-
  At the June 26, 2025 Board of Selectmen special meeting the sole action item
  was the elementary school's solar project, and the board voted 4-0 to
  approve the second amendment to the solar power and services agreement.
  First Selectman Jeff Maguire, presiding, ran the item; the town attorney
  reported that he had reviewed the amendment and coordinated with the Board
  of Education's own solar attorney before urging approval. The amendment
  reduced the panel count and adjusted the lifetime rate, still described as
  better than the district's current rate and held for twenty years. At the
  July 9, 2025 Board of Education meeting a district update reported that the
  solar amendment had been sent bearing the signatures of the board chair and
  the First Selectman.
