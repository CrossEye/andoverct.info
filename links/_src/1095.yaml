id: 1095
title: >-
  Budget referendum results, May 26, 2026 -- the town's budget passes, the
  school's fails
description: >-
  The official results, as posted by the town, of the May 26, 2026 referendum,
  the first after the budgets were bifurcated. The town budget passed, 412 to
  367. The elementary school's budget, reduced to a 9.82% increase, failed,
  343 YES to 431 NO. The RHAM operating budget passed in Andover, 417 to 360,
  but failed region-wide; the RHAM capital budget passed, 424 to 360.
url: https://www.andoverconnecticut.org/sites/g/files/vyhlif5346/f/uploads/5.26.26_results.pdf
date: 2026-05-26
