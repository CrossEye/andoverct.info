id: 1102
title: >-
  Town of Andover corrective action plan for fiscal year 2025, filed with the
  State on May 6, 2026 -- what the town told the State it would do about the
  reconciliation finding
description: >-
  The Town of Andover's corrective action plan for the fiscal 2025 audit,
  signed by the Town Administrator and addressed to the Municipal Finance
  Services Unit of the State of Connecticut Office of Policy and Management,
  dated May 6, 2026. It addresses Finding 2025-001, the material weakness in
  the reconciliation of the town's and the school district's general ledgers.
  Statement of concurrence: "Management of the Town concurs with the finding."
  Corrective action, in full: "The Town will no longer record balances and
  activities that are already accounted for by the School District. The Town
  will limit its accounting to transactions that involve direct financial
  activity between the Town and the School District. The Town will reconcile
  interfund transactions and balances monthly and will annually reconcile
  General Fund expenditures to the School District's accounting system."
  Projected completion date: June 30, 2026. The plan contains no reference to
  changing how or when the school district receives its appropriation, and no
  reference to check registers, payroll registers, or receipt-conditioned
  disbursement. Filed eight weeks before the First Selectman's July 1, 2026
  email (1087), which states as one of its purposes the elimination of
  reconciliation issues identified during the town's annual audit. Retrievable
  by the public from OPM's Electronic Audit Reporting System at
  ears.opm.ct.gov, under Public Search, Corrective Action Plans, entity
  Andover, year 2025. Scanned image PDF; text above transcribed by OCR and
  checked against the page images.
url: https://andoverct.info/reference/docs/andover-corrective-action-plan-fy2025.pdf
date: 2026-05-06
