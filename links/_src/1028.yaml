id: 1028
title: >-
  Andover assessor's records -- the School Road parcels are owned by the Town
  of Andover
description: >-
  The Andover assessor's records show the entire School Road complex titled to
  the Town of Andover: the elementary school parcel at 35 School Road (10.7
  acres, use "Schools-Public," deed Volume 15 Page 131); the town hall at 17
  School Road (0.92 acres, deed Volume 19 Page 151, acquired 1963); and the
  vacant lot behind the town hall where the community and senior center was
  built (3.0 acres, deed Volume 20 Page 272, acquired 1965). The school
  district holds no title to any of it, and has not for sixty years. No land
  was transferred from the school district to the town, because none was ever
  held by the district.
url: https://gis.vgsi.com/andoverct/Parcel.aspx?pid=988
