id: 1022
title: >-
  Board of Education meeting, November 12, 2025 -- the First Selectman's
  request for preschool data
description: >-
  At the November 12, 2025 Board of Education meeting the superintendent
  addressed a records request from First Selectman Jeff Maguire consisting of
  four spreadsheets seeking preschool cost data, including each student's town
  of residence and the tuition paid, together with staff insurance enrollment.
  Present as the ex officio member, he pressed the request on the record: he
  said he had listed the children only as student one through sixty-four,
  asked why the data could not simply be redacted, and argued that the board
  could not have analysed whether the preschool is costly to the town "without
  getting the details," and cannot truly evaluate the program without them.
