id: 510
title: CTLCV 2025 Environmental Scorecard
description: >-
  The Connecticut League of Conservation Voters' 25th-annual scorecard,
  covering 23 environmental bills of the 2025 session. The House table
  lists Weir at 55%, tied for 24th-lowest of the 151 House members.
  Across CTLCV's last three scorecards Weir places in the bottom fifth of
  the House each year. Retrieved July 2026.
