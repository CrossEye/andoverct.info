id: 1001
title: >-
  Andover Charter (2024 revision), Section 501 -- ex officio membership
description: >-
  Section 501 of the current Andover Charter provides that the First
  Selectman, or a designee who must be a Selectman, "shall be an ex officio
  member of all other town commissions, boards and agencies." This is the
  charter provision under which the First Selectman may sit with the Board of
  Finance and the Board of Education. The section grants the seat to the First
  Selectman or to a selectman designee.
url: https://charter2024.andoverct.info/
date: 2026-07-10
