id: 1019
title: >-
  Board of Education meeting, February 11, 2026 -- the superintendent on years
  of questioning; the First Selectman on when he began attending
description: >-
  At the February 11, 2026 Board of Education meeting the superintendent said
  on the record that for six years the First Selectman, sitting ex officio,
  has publicly questioned her, the board, the teachers and the principal
  "every single time" (~2:00:39). The First Selectman replied that he "just
  started to attend board of education meetings in October," pointing to the
  recordings for the earlier years (~2:01:23). Asked as the ex officio member
  where he would cut the school's budget, he restated his standing request for
  detailed line-item information and named salaries as the main increase
  (~2:19:13).
