id: 1046
title: >-
  Board of Selectmen meeting, July 8, 2024 -- the town's investment account
  and the school's balance
description: >-
  Discussing the town's short-term investment account at the July 8, 2024
  Board of Selectmen meeting, the town administrator told the board the town
  had roughly $3.4 million in it and that the town should "try to have as much
  money... including the AES balance in that account so that we maximize our
  interest earning potential" (~71:16). He explained that one option would be
  to encourage the school to open its own investment account, though
  "technically a school is only supposed to be spending what is budgeted," so
  unspent money "should go back to the town anyway," and that the town could
  instead agree with the school board that such money automatically flow into
  the AES Capital Fund, which would mean "that much less money that we as a
  town have to put into that Capital fund" (~71:16-73:18).
