id: 1012
title: >-
  Board of Finance packet, July 23, 2025 -- the elementary school's levy
  schedule
description: >-
  The Board of Finance packet for July 23, 2025 contains the motion text and
  the payment table for the 2025-2026 levy schedule for the Andover Board of
  Education: ten equal monthly payments, July through April, of $456,546 each.
  This is the document that sets out how the school's approved budget is
  actually released to it, and the exact monthly figure.
