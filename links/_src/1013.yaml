id: 1013
title: >-
  Board of Finance minutes, July 24, 2024 -- FY2024-25 levy schedule accepted,
  6-0
description: >-
  The minutes of the July 24, 2024 Board of Finance meeting, carried in the
  following month's packet, record the elementary school's levy schedule "to
  be paid July 2024 through April 2025," presented by the town administrator.
  A motion to accept the schedule as presented was made, seconded, and carried
  6-0-0.
