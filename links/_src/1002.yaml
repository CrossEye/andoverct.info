id: 1002
title: >-
  FERPA, 20 U.S.C. 1232g (Family Educational Rights and Privacy Act)
description: >-
  The federal statute protecting the privacy of student education records.
  Where a request for information would resolve to an identifiable student,
  FERPA requires a school district to withhold it.
url: https://www.law.cornell.edu/uscode/text/20/1232g
date: 2026-07-10
