id: 1045
title: >-
  Board of Selectmen meeting, September 9, 2024 -- the town administrator on
  the parking lot's status
description: >-
  Reviewing the town's project list at the September 9, 2024 Board of
  Selectmen meeting, the town administrator gave an account of the elementary
  school's upper parking lot. He said the school board still very much wanted
  to redo it; that the previous year's bid put it at roughly $135,000; that
  "right now there would be the money set aside to do that"; but that "the
  school board has prioritized doing the internal work, plumbing work, to
  restore the bathrooms that have failed in the upper part of the building."
  The parking lot, he said, "could be done essentially at any time, we could
  schedule that for next spring, we just have to make sure that we have the
  funding to pay for it" (~32:18).
