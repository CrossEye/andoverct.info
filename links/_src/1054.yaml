id: 1054
title: >-
  Tri-Board meeting, October 12, 2023 -- the boards are asked whether the town
  has interfered
description: >-
  At the October 12, 2023 joint meeting of the three boards, a moderator asked
  the Board of Education directly whether the town had interfered in the
  application of its role. The board answered: "We were not able to get a
  permit to pave our upper parking lot over the summer, and therefore it is
  still sitting unpaved and dangerous for people to walk on," and "we were
  told about four different reasons for why we were not able to have that
  permit before we finally gave [in to] an agreement that we would give the
  money to the town" (~1:04:37-1:04:57). The town's answer, from the First
  Selectman: the town had not interfered on an operational level, and the
  issue was "the fact that we did not acquiesce [to] the way that you want to
  do a capital improvement project" (~1:06:59). He said the only condition
  requested was that public works and the town administrator create
  specifications so the job was done correctly, "that's what you and your
  board failed to do when you went around the [proper] process" (~1:39:25).
  The town administrator then set out the engineering substance behind the
  conditions.
