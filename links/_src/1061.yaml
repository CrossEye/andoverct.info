id: 1061
title: >-
  Board of Finance budget meeting, March 11, 2026 -- the preschool discussed
  at the finance board
description: >-
  At the March 11, 2026 Board of Finance budget meeting the preschool was
  discussed at length. One member said she had "questions about the fact that
  we have no idea how much the taxpayers are paying for preschool," and that
  out-of-town families "are not coming here for any other reason" than the
  full-day preschool and its wraparound care (~2:11:36-2:13:24). Another
  member set out the empty-seat logic unprompted: "when you put together a
  preschool class, you look at how many Andover kids there are, and then you
  sprinkle in out of town kids to fill that room." The First Selectman was not
  the speaker on either side of this exchange.
url: https://andoverct.info/reference/video/transcripts/UNSwo7NhWX4.html
date: 2026-03-11
