id: 1094
title: >-
  Budget referendum results, May 5, 2026 -- the combined town budget, carrying
  the school's appropriation, fails
description: >-
  The official results, as posted by the town, of the May 5, 2026 referendum.
  At the first referendum of the cycle the town budget, which carries the
  elementary school's appropriation, went to the voters as a single question,
  and it failed, 331 YES to 451 NO. Two advisory questions asked whether the
  town and school budgets were too high, too low, or about right. The RHAM
  operating budget passed in Andover, 390 to 379, and the RHAM capital budget
  failed, 377 to 395; both failed region-wide. After the defeat the town and
  school budgets were bifurcated for the votes that followed.
url: https://www.andoverconnecticut.org/sites/g/files/vyhlif5346/f/uploads/5.5.26_vote_results.pdf
date: 2026-05-05
