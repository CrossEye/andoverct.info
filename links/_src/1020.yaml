id: 1020
title: >-
  Board of Education meeting, January 14, 2026 -- out-of-town preschoolers,
  full tuition, and empty seats
description: >-
  At the January 14, 2026 Board of Education meeting the superintendent
  explained that the district began accepting out-of-town preschoolers about
  two years ago to fill otherwise-empty seats: adding a fourth preschool class
  left seats unfilled, and out-of-town children, who pay full tuition of
  $6,000, keep the room sustained as in-town enrollment grows (~59:37). Nine
  out-of-town children were enrolled this year; with more Andover residents
  enrolling, four are projected for next year.
