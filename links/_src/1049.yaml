id: 1049
title: >-
  Board of Finance meeting, March 27, 2024 -- the parking-lot money, and the
  plumbing becoming the school's first priority
description: >-
  At the March 27, 2024 Board of Finance meeting the town administrator
  recounted the mechanics of the school's parking-lot money. He said that when
  the school wanted to do the parking lot the previous summer, what was agreed
  was that it transfer a check; that the town requested $130,000; that the
  school "originally wrote a check for like 124... which they then took back
  because they didn't actually have 124 to write"; and that the final figure
  was about $112,000 (~2:58). Board members confirmed the arrangement: the
  school transfers the money to the town, into the town-held capital account,
  with the town's $100,000 budget contribution added to it, because, as one
  member put it, the town "controls the account" (~5:55). Later in the meeting
  the board discussed the school's plumbing failure -- seventy-year-old cast
  iron pipe, three unusable bathrooms -- and concluded it was significantly
  more expensive and much more pressing than a parking lot, so it moved to
  first priority.
