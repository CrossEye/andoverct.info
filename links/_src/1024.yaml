title: >-
  Board of Education meeting, October 9, 2025 -- the First Selectman questions
  the bathroom contractor selection
description: >-
  At the October 9, 2025 Board of Education meeting First Selectman Jeff
  Maguire questioned the selection of the general contractor for the bathroom
  renovation. After the superintendent reported that the school's engineering
  firm, in a design-build arrangement, had recommended a general contractor
  with identified subcontractors, he pressed that the board had announced a
  general contractor with no cost figures attached: "if you're announcing the
  general contractor... What's the number? And you're all telling me we have
  no number." He argued that the town's prior capital projects had been
  managed by the town administrator, and that the boards should work together
  and use the expertise available.
