id: 1032
title: >-
  Joint Board of Finance and Board of Selectmen meeting, February 25, 2026 --
  the out-of-town preschool cost
description: >-
  At the February 25, 2026 joint budget meeting of the finance and selectmen's
  boards, First Selectman Jeff Maguire pressed the preschool as an out-of-town
  cost question, asking whether residents are paying for out-of-town students
  and arguing the tuition does not cover the cost: with roughly fourteen out-
  of-town or staff children among about sixty-eight preschoolers, "they're
  paying at a maximum $6,000 of tuition, you're not covering your costs," and
  "a standard pre-K from a private business is going to be $12,000, you're
  charging six." He told the finance board, "you guys have to get the proof."
  The superintendent and board members answered on the record.
