id: 1027
title: >-
  Board of Selectmen meeting, June 12, 2023 -- the school board's concerns
  about the community center
description: >-
  At the June 12, 2023 Board of Selectmen meeting, with members of the school
  board and the superintendent present, the selectmen took up a list of safety
  and deed concerns the Board of Education had submitted about the community
  and senior center being built on the elementary school grounds. First
  Selectman Jeff Maguire, presiding, treated the concerns as matters for the
  architect, builder, engineer and fire marshal rather than for the board, and
  the project moved forward. He stated that the school building is "a town
  asset" and that "it's all the same pot of funds -- the school is town money,
  the roads are town money, the parking lot is town money" (~14:46). At the
  same meeting the board voted 4-0 to establish a separate AES Capital Fund.
  Video: https://www.youtube.com/watch?v=A-u_Seb_VrE
