id: 1086
title: >-
  Superintendent Pay in Context -- Andover's superintendent compensation
  against its Connecticut peers, FY2025-26
description: >-
  A compensation study comparing Andover's superintendent pay with essentially
  every Connecticut public school district operating only elementary grades:
  45 districts, less Norwich as structurally unlike. Contract data was
  collected for 39 of them, from town and district websites, from scanned
  public postings, and by records requests to town clerks, and the contracts
  themselves are published with the report. All figures are cash compensation
  (salary plus any board-paid annuity, longevity bonus and fixed allowances)
  normalized to a full-time-equivalent 260-day year, because Connecticut
  superintendent contracts range from a few days a week to full-time regional
  posts. Andover employs its superintendent at 0.6 full-time-equivalent and
  pays $90,000 in salary plus a $10,000 retirement contribution, a total of
  $100,000; she serves Scotland for the remaining 0.4 under a separate
  contract with that town. Normalized to full time, Andover's rate is
  $166,667. Among peers with current contracts Andover ranks 23rd of 24,
  against a peer median of $193,157. The only district paying less is
  Eastford, whose superintendent works 104 days a year. The study also finds
  that pay in this cohort is essentially uncorrelated with district
  enrollment. It states its own limitation: current contracts for five further
  peer districts have not yet been located, and one could come in at or below
  Andover's rate.
url: https://andoverct.info/reports/aes/superintendent-pay/
date: 2026-07-12
