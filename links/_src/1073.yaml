id: 1073
title: >-
  Board of Selectmen meeting, February 15, 2022 -- the First Selectman on the
  board's authority over the school
description: >-
  Asked from the floor about the mask mandate at the elementary school, First
  Selectman Jeff Maguire, presiding, answered: "This board doesn't have
  anything to do with the school mandate or how it's addressed. That's the
  Board of Education. Just so before everybody goes down that road, this board
  has control of public buildings such as the town hall, the library, the
  museum, and those types of facilities" (~2:19:39). The question he was
  answering concerned a school health policy, and his answer concerns which
  board governs the school. No minutes for this meeting are posted; the
  speaker is identified from the recording. Video:
  https://www.youtube.com/watch?v=8Y8S8zglWek
url: https://andoverct.info/reference/video/transcripts/8Y8S8zglWek.html
date: 2022-02-15
