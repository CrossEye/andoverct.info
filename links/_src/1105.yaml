id: 1105
title: >-
  Board of Selectmen meeting, March 10, 2025 -- a resident engineer tells the
  board the school should relinquish authority over its capital projects to
  town officials
description: >-
  During public comment at the March 10, 2025 Board of Selectmen meeting, the
  same meeting at which the First Selectman moved to have the town attorney
  amend the school's solar agreement (1036), a resident, Robert Hamburger,
  spoke to the solar project and placed it in what he called "the larger
  context of other recent years' capital issues like the problems with the
  school's bathrooms, the parking lot, and of course the disputes over the
  property lines related to the construction of the community center." He said
  he wished to concur with an earlier speaker's notion "that the school building
  is a town asset and should be dealt with as such by town officials." He
  described the community-center property-line dispute as "a complete train
  wreck" that "accomplished nothing except spending something like 30 grand of
  town funds on needless and ultimately useless legal challenges." His central
  argument: the town has "officials and board members with specific and detailed
  experience in construction, engineering and project management, while the
  school does not," naming a selectman with solar-industry experience and a
  selectman who is an electrical engineer; that school and Board of Education
  officials had "demonstrated pretty conclusively that they're not able to
  effectively manage these capital issues"; and that they "really just need to
  concede these inabilities in these matters and relinquish the authority to
  those folks in town who know how to get these things done." He identified
  himself as "an advanced degreed electrical engineer with 43 years professional
  experience," and added that he did not mean the school officials were "bad
  people or have nefarious intentions," only that they lacked "the professional
  expertise or the specific domain knowledge." The remarks are the speaker's
  own, offered in public comment; he is a resident and former Planning and
  Zoning Commission chair, not a town official, and the position is his, not the
  board's. Timecode ~2:06:12 to ~2:08:25. Video:
  https://www.youtube.com/watch?v=WNnDwbikxfQ&t=7572s
