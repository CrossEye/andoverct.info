id: 1018
title: >-
  Board of Education meeting, February 11, 2026 -- the First Selectman on the
  preschool, and the superintendent's answer
description: >-
  At the February 11, 2026 Board of Education meeting the First Selectman,
  sitting ex officio, said his "biggest issue" with the school budget is the
  preschool and that he focuses on it, and questioned whether preschool is
  still mandated (~1:47:30). Pressed later on where he would cut, he pushed
  for line-item detail and framed the increases as salary-driven (~2:19:13).
  The superintendent answered on the record that none of the roughly $499,000
  budget increase is attributable to the preschool, and that recent enrollment
  growth splits roughly evenly between the elementary grades and the preschool
  (~1:39:40, ~1:59:46).
