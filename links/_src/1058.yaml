id: 1058
title: >-
  Board of Selectmen meeting, August 14, 2023 -- the town authorizes a
  conditioned paving permit
description: >-
  At the August 14, 2023 Board of Selectmen meeting First Selectman Jeff
  Maguire, presiding, took up the elementary school's upper parking lot. He
  reported meeting with the school board chair and the finance board chair,
  and set out the terms: the project would use the new town-held fund that the
  town administrator and the Board of Finance had established for the school's
  capital projects, and his one condition was that the work be performed to
  specifications laid out by the director of public works and the town
  engineer (~10:15). He said he had no objection to the project itself: if it
  is done in accordance with the engineer and public works, "I have no problem
  with the project moving forward," though he added it might not be the most
  useful project to do at the school (~11:41). The town administrator then set
  out the technical conditions at length: basin tops, reclamation depth, tack
  coating, indemnification, performance bonding, compaction and thickness
  testing, and public-works backfill.
