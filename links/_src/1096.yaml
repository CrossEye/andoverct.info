id: 1096
title: >-
  Budget referendum results, June 16, 2026 -- the school's budget passes on
  the third vote
description: >-
  The official results, as posted by the town, of the June 16, 2026
  referendum. The elementary school's budget, reduced to a 6.0% increase,
  passed, 420 YES to 317 NO. The RHAM operating budget passed, 479 to 252, and
  passed region-wide. This is the vote that settled the budget the school
  operates under in FY 2026-2027.
url: https://www.andoverconnecticut.org/sites/g/files/vyhlif5346/f/uploads/6.16.26_referendum_results.pdf
date: 2026-06-16
