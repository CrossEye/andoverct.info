id: 1007
title: >-
  HIPAA definitions and the employment-records exclusion, 45 C.F.R. 160.103
description: >-
  The HIPAA definitional provision. Information a town holds as an employer,
  in payroll and budget records, is treated as employment records, which
  HIPAA's own definition of protected health information excludes. HIPAA is
  the law most often reached for in a health-privacy argument, and it is
  generally not the one that governs here: the protection of employee benefit
  detail rests on Connecticut's freedom of information statute, and the
  protection of student information rests on FERPA and IDEA.
