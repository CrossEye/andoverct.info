id: 1041
title: >-
  Board of Finance meeting, December 18, 2024 -- the Board of Finance adopts a
  policy for the school's capital fund
description: >-
  Two weeks after the December 4 tri-board meeting, the Board of Finance
  adopted a usage policy for the AES Capital Fund. The fund is held on the
  town's books: the town "may choose to deposit money into this Capital fund
  through its budget process" (it put in $100,000 that year, the first), and
  the Board of Education "may also choose to deposit money from its budget,"
  meaning its post-audit surplus, with all money in the fund to be spent on
  capital projects for the elementary school (~53:19-55:24). The policy was
  adopted subject to the school board's review and feedback (~63:54). Board
  members explained the fund's origin: the school, unlike the regional
  district, had never historically had a capital budget of its own, so its
  only vehicle to save for capital was its 2 percent non-lapsing account
  (~39:29).
