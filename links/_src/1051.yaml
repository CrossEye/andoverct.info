id: 1051
title: >-
  Board of Education meeting, July 12, 2023 -- the town does not sign the
  memorandum of understanding
description: >-
  At the July 12, 2023 Board of Education meeting the board reported that the
  memorandum of understanding it had drafted, at a selectman's request, had
  been rejected -- not by a vote or a letter, but by the town administrator
  speaking at a planning and zoning meeting: "Eric Anderson said the town will
  not sign the MOU that we presented" (~37:52). A board member noted that
  three selectmen, including the First Selectman, were present at that meeting
  and none contradicted him (~38:10). The board had received no formal
  response from the Board of Selectmen to a document that board had asked it
  to produce, and voted to seek one in writing (~40:38). The board chair also
  reported that he had raised the town administrator's conduct with the First
  Selectman, who acknowledged it was not correct and said he would speak to
  him (~43:52), and that the First Selectman had invited him to the
  groundbreaking (~46:40).
