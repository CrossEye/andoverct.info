id: 1106
title: >-
  Public Facebook comment, July 2026 -- a former PTA member on the PTA's role
  in the senior-center siting question
description: >-
  A public comment left on the "A Town Asset" series post in a town Facebook
  group. Lori Blake, identifying herself as a PTA member at the time of the
  senior-center siting discussions, responds to the series' statement that the
  town's request to use the school's unused floor space had been "shot down by
  the Board of Education and the PTA." She states that the PTA had no vote in
  the matter and so did not formally say no, but that its members, herself
  included, spoke out against siting the center in the school over security,
  usage, and parking concerns, and met with school personnel and the
  superintendent, whose position aligned with that view. This is a firsthand
  recollection stated publicly by a named participant, not a town record; it
  is cited as testimony to that effect, offered contemporaneously and under
  her own name, and it is the basis for the correction appended to the senior-
  center piece. Facebook comment permalinks are unstable and archive.org could
  not capture the page, so the linked image is a self-hosted screenshot
  preserving the comment as it stood; the original Facebook comment is at
  facebook.com/groups/2788103908136116/posts/4659730580973430 (comment_id
  4660364534243368), which may or may not resolve for a given reader.
