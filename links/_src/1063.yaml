id: 1063
title: >-
  Board of Selectmen, December 12, 2022 and January 9, 2023 -- the town
  surveys, rezones and refers the school parcel
description: >-
  At the December 12, 2022 Board of Selectmen meeting the town administrator
  reported an upcoming planning and zoning hearing on "the zone change that
  will enable a community center to be built on the town's property," and that
  a surveyor had been researching the town's records and walking the School
  Road parcel (~39:39). At the January 9, 2023 meeting he reported that the
  survey was due and that he had filed the statutory 8-24 referral for the
  community center parcel "on behalf of the board of selectmen, from myself,"
  which the commission approved (~1:45:54, ~1:47:51). Each of these steps was
  an ordinary, public municipal process. The Board of Education's own account,
  given the following June, is that its building committee had not met since
  May 2022, that it had "been in the dark," and that its first notice was a
  map; the First Selectman said at that meeting that he should have done a
  better job of inviting a board member onto the committee.
