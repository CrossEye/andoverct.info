id: 1016
title: >-
  Board of Education meeting, March 11, 2026 -- a recorded public vote
  affirming the superintendent's contract
description: >-
  At the March 11, 2026 Board of Education meeting the board entered executive
  session to discuss the superintendent's contract, resumed with the recording
  running, and took a public roll-call vote to proceed with the contract as
  written from its October meeting. One member abstained, having been absent
  in October. The vote is on the public record.
url: https://andoverct.info/reference/video/transcripts/boe-2026-03-11.html
date: 2026-03-11
