id: 1025
title: >-
  Board of Education meeting, October 9, 2025 -- the superintendent's contract
  goes to executive session
description: >-
  At the October 9, 2025 Board of Education meeting the board entered
  executive session at about 9:23 PM to discuss the superintendent's contract,
  "which is up this year," and resumed the recording at 10:01 PM. The chair
  then asked only for other action items and the meeting moved on. No public
  vote on the contract appears on the record of that meeting. The recording
  was running when the board returned; what is absent is the vote, not the
  recording. The contract was subsequently affirmed by a recorded public roll-
  call vote on March 11, 2026.
