id: 1038
title: >-
  Board of Selectmen special meeting, February 25, 2025 -- a town meeting is
  scheduled on the school's solar project
description: >-
  At the February 25, 2025 Board of Selectmen special meeting, the Board of
  Education, through its representative, asked the selectmen to schedule a
  town meeting specifically for the solar project at the school, separate from
  the town's other items (~1:20). The selectmen discussed whether the school's
  power purchase agreement should go to a town vote at all. One selectman
  argued the town had to vote because of the potential cancellation-penalty
  liability, saying the town meeting is the legislative body (~8:36). The
  board voted 4-0 to schedule a town meeting for March 13, 2025.
