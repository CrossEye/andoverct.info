id: 1021
title: >-
  Board of Selectmen meeting, January 12, 2026 -- the bathroom project moves
  from a competitive bid to design-build
description: >-
  At the January 12, 2026 Board of Selectmen meeting the board reviewed the
  contracting of the elementary school's bathroom renovation. The project had
  been expected to go out to a competitive request for proposals, but had
  become a design-build arrangement in which the school's engineering firm
  sought to act as general contractor and roll the trades into a single bid
  (~36:33, ~1:04:41). The school board's dedicated bathroom committee meeting
  of January 5, 2026 records the project's origin, a leak in May 2024 that
  proved to be a larger drainage failure, and the move to seek additional
  contractor bids.
