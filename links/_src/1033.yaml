id: 1033
title: >-
  Board of Finance meeting, December 17, 2025 -- the First Selectman on the
  bathroom project and the school's process
description: >-
  At the December 17, 2025 Board of Finance meeting First Selectman Jeff
  Maguire questioned the bathroom-renovation spending and the process behind
  it, saying he would support the project but had "a problem with how we've
  been doing things." He challenged whether the work was needed at the
  school's current enrollment, and tied it to his objection that the school's
  unexpended funds had been moved into the capital fund without selectmen or
  capital-committee oversight. The finance board chair, Robert England,
  responded that the board weighs the whole town's needs and that he himself
  sits on the capital improvement committee.
