id: 1035
title: >-
  Annual Budget Meeting, April 9, 2025 -- how the school's capital fund is
  held and funded
description: >-
  At the April 9, 2025 Annual Budget Meeting the Board of Finance chair
  explained how the elementary school's capital projects are funded: "Andover
  Elementary School Capital Fund. We established this last year, put about
  $100,000 of seed money in it. This was a problem prior because the
  elementary school did not have any way to fund major projects... they don't
  have a means to have a capital fund separately from the town, so we had to
  set one up in the town." He said the fund was not seeded again this year and
  is instead fed by the school's own surplus, about $360,000 returned after
  the audit (~15:46). He added that the surplus flows into the fund only by
  the town's yearly vote, and that if the town declined to permit it, the
  money "would then just be absorbed back into the town's funds" (~52:45).
