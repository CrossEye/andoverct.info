id: 1039
title: >-
  Board of Selectmen meeting, January 13, 2025 -- the selectmen divide over
  whether the town should vote on the school's solar project
description: >-
  At the January 13, 2025 Board of Selectmen meeting the board split over
  whether the town should involve itself in the elementary school's solar
  project. Selectman Anne Cremé argued it was not the town's business: "the
  solar is the school and the school is the one who's going to be working on
  that... it's simply the school's Authority," and "the Board of Education has
  control of the school building and we should not be usurping what the Board
  of Education should be working on" (~57:09-59:02). First Selectman Jeff
  Maguire, presiding, rejected that, challenged her for having voted against
  the solar referral at planning and zoning, and asked "who do you work for --
  you work for the town of Andover or... the faction on the board of education
  that does not want to work with us" (~59:02). Selectman Jeff Murray then
  intervened, saying he supported the solar project but was concerned that
  solar companies overstate the savings they promise. Video:
  https://www.youtube.com/watch?v=BoLJQi4XujI
url: https://andoverct.info/reference/video/transcripts/BoLJQi4XujI.html
