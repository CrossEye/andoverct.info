id: 1031
title: >-
  Board of Selectmen, June 9 and 12, 2025 -- the First Selectman challenges
  the transfer of the school's unexpended funds
description: >-
  Across the June 9 and June 12, 2025 Board of Selectmen meetings, First
  Selectman Jeff Maguire challenged the Board of Finance's authority to move
  the school's unexpended year-end appropriation into the AES capital fund,
  arguing the transfer was done incorrectly and should require a town-meeting
  vote. He restated his framing that the school is town property: "The school
  building is a town asset. The town hall is a town asset. The community
  center is a town asset," and that the capital fund "is a town account, not a
  board of education account." The superintendent objected on the record
  ("respectfully, Mr. Maguire, you're offering some misinformation... we have
  a good auditor who has done right by this town"). The town's auditor
  subsequently found no impropriety in the transfer. On June 12 the board
  voted to set a town meeting on the question.
