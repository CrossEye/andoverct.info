id: 1069
title: >-
  Board of Finance meeting, March 16, 2022 -- the preschool's cost structure
  in the school's budget presentation
description: >-
  In the FY2022-23 budget presentation to the Board of Finance, the
  superintendent walked through the preschool's grant lines and said that this
  is "really why when we say preschool, we say pays for itself between the
  tuition and" the grants (~14:01). She named them: the Smart Start grant pays
  the preschool salaries; IDEA funds pay the paraprofessional salaries; school
  readiness money funds sixteen slots and the grant-compliance liaison.
