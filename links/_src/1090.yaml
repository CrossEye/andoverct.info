id: 1090
title: >-
  The demand and the release -- the withheld payment moves on the Sunday night
  before the selectmen meet, July 8-12, 2026
description: >-
  From the Town's July 16, 2026 records response. July 8: the Board of
  Education's attorney, Peter J. Murphy of Shipman & Goodwin, writes the First
  Selectman and Town Administrator that the Board's approved budget is
  $4,839,390, that a payment of approximately one tenth was due July 1, and
  that "the Board received a payment of only $100,000"; that the "Approval
  Process" violates the Board's rights under Conn. Gen. Stat. 10-222 and has
  no authority in the Town Charter, whose expenditure provisions exempt the
  Board of Education; and that the First Selectman's own July 6 email
  "demonstrates that the Board of Selectman never discussed nor approved the
  Approval Process." It demands the remainder of the July payment (pp. 47-51).
  July 9: Superintendent Bruneau formally requests the remaining balance be
  transferred that day (p. 53). July 10: the attorney repeats the demand to
  the Treasurer and Town Administrator and notes the July 13 Board of
  Selectmen agenda item, whose packet contains no documentation of the
  procedure being acted on (pp. 52-58). Sunday, July 12, 8:46 PM: Town
  Treasurer Lisa Jablonski reports she has made the transfer, after 5 PM,
  expected to post around July 14 -- the night before the Board of Selectmen's
  July 13 meeting (p. 59).
