id: 1089
title: >-
  The proposal, the objections, and the absence of any vote -- the written
  record, June 22 through July 6, 2026
description: >-
  The correspondence, from the Town's July 16, 2026 records response, that
  establishes in writing that no board voted on the funding change. June 22:
  the First Selectman sends both board chairs a written "Proposed AES
  Operating Account Structure" -- the same account, the same weekly registers
  (pp. 6-7). June 23: BOE chair Caitlin Greenhouse declines in writing; the
  board is "likely not interested in pursuing this proposal at this time," and
  she will share it with the full board (pp. 8-9). June 24: he forwards the
  proposal to all six Board of Finance members "so that we can have a
  discussion" (pp. 10-11); no meeting of any board takes it up. July 1, hours
  after the announcement: the chair replies that no responsibility of a First
  Selectman allows this "without BOF, BOS and BOE approval," that AES should
  have received one tenth of its operating budget that day, and that the board
  has reached out to its attorney (pp. 14-15). July 2: BOF chair Robert
  England: "It is very unclear to me that this is right and proper. First, did
  the BOS vote on this? The BOF certainly didn't," quoting and attaching the
  July 23, 2025 minutes of the 7-0 levy-schedule vote (pp. 27-30). July 3:
  Selectman Anne Creme: she does "not agree," a change "would require a
  discussion and vote by the Board of Finance and the Board of Education,"
  "The BOS has not discussed or voted on this new process," and "I think you
  overstepped your role" (p. 31). July 6: the First Selectman himself, in
  writing: "The Board of Selectmen has not yet voted on this procedural
  change... Until such time, I am responsible for implementing this change"
  (p. 38) -- while, the same morning, the change has become "the proposed
  funding procedure," which the full Board of Selectmen "will have the
  opportunity to discuss, modify, or affirm" at its July 13 meeting (pp.
  32-37).
