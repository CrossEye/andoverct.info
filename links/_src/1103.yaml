id: 1103
title: >-
  Town of Andover corrective action plan for fiscal year 2024 -- the same town
  remedy a year earlier, and the school district's own plan for the finding it
  went on to clear
description: >-
  The Town of Andover's corrective action plan for the fiscal 2024 audit,
  filed with the State of Connecticut Office of Policy and Management. It
  carries two plans. The town's plan for Finding 2024-001, the material
  weakness in the reconciliation of the town's and the school district's
  general ledgers, is word for word the plan filed again a year later (1102):
  stop recording balances already accounted for by the school district, limit
  town accounting to direct financial activity between the two, reconcile
  interfund transactions and balances monthly, reconcile General Fund
  expenditures to the school district's accounting system annually. Contact
  listed: the Town Treasurer. Separately, the school district filed its own
  plan for Finding 2024-002, the significant deficiency over bank and
  interfund reconciliations at the school district: bank reconciliations had
  previously been performed outside the accounting system, the district had
  begun using the accounting system's reconciliation feature and implementing
  monthly reconciliations of all interfund accounts, and was considering a
  financial consultant to support the business manager. Projected completion
  date: June 30, 2026. The fiscal 2025 audit reports that 2024-002 is no
  longer being reported (1101); 2024-001 repeated as 2025-001. Retrievable by
  the public from OPM's Electronic Audit Reporting System at ears.opm.ct.gov,
  under Public Search, Corrective Action Plans, entity Andover, year 2024.
  Scanned image PDF; text above transcribed by OCR and checked against the
  page images.
