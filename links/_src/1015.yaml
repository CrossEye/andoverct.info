title: >-
  Board of Education meeting, March 11, 2026 -- a letter from the First
  Selectman, by way of a law firm, questioning the superintendent's contract
description: >-
  At the March 11, 2026 Board of Education meeting the chair read into the
  record two letters sent to the full board. The first, attributed on the
  record to First Selectman Jeff Maguire and sent by way of a law firm, posed
  questions specifically about the superintendent's contract.
