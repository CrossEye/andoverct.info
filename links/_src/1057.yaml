id: 1057
title: >-
  Board of Education meeting, April 19, 2023 -- the previous contract renewal,
  approved in open session and entered in the minutes
description: >-
  At the April 19, 2023 Board of Education meeting the board went into
  executive session at 9:07 PM to discuss the superintendent's contract, came
  out at 9:55 PM, and immediately took a public vote: a motion to accept the
  terms of the proposed renewal of the superintendent's contract for the
  2023-24, 2024-25 and 2025-26 school years, as discussed in executive
  session, carried 7-0-0. The vote is on the recording (~2:06:40) and is
  written into the official minutes. It is the renewal that was due to expire
  in June 2026, which is why the contract was "up this year" in October 2025.
url: https://andoverct.info/reference/video/transcripts/boe-2023-04-19.html
date: 2023-04-19
