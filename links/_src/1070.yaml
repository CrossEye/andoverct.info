id: 1070
title: >-
  Board of Finance minutes, 2015-2026 -- a census of the First Selectman's
  attendance
description: >-
  A census of the attendance blocks of every Board of Finance minutes document
  in the town's archive. The First Selectman is not listed present at a single
  Board of Finance meeting from 2015 through 2024, across fifty-two readable
  meetings in the 2020-2024 stretch alone. He first appears on May 7, 2025,
  and from October 2025 forward he is present at most meetings, in consecutive
  months: October 22, November 19 and December 17, 2025, and January 28,
  February 25, March 24, April 1, May 6 and May 27, 2026. These minutes
  routinely name non-members in attendance, including the town administrator,
  the treasurer, the board clerk, Board of Education representatives, and,
  where applicable, "Public Present: none," which is what makes the earlier
  absence meaningful. Jeff Maguire has held the office of First Selectman
  throughout this period; the Board of Selectmen minutes of June 8, 2020
  record him calling that meeting to order.
url: https://www.andoverconnecticut.org/board-finance/links/meeting-minutes
date: 2026-07-12
