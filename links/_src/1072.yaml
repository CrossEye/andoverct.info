id: 1072
title: >-
  Board of Selectmen meeting, March 16, 2021 -- the community center design
  money, and the town's earlier attempt to use space inside the school
description: >-
  At the March 16, 2021 Board of Selectmen meeting, a consultant presenting
  plans for a community center walked the board through square footage, design
  costs and a site survey, and argued for the money to draw the project. He
  recounted its history on the record: sought since 1969, present in five
  consecutive plans of development, and the top item on the town's own long-
  range survey. He then said: "our first attempt two years ago was to use the
  unutilized 50% school capacity floor space. That was shot down by the Board
  of Education and the PTA," adding, "we keep spinning our wheels. We're doing
  what the town tells us to do, but no one's allowing us to do anything"
  (~1:03:26). Before the town built on the school's grounds, it had asked to
  use empty space inside the school, and the school had refused. The meeting
  approved staged architectural work from a reserve the town had been building
  for several budget cycles. Video: https://www.youtube.com/watch?v=X8MAn-
  kVe3k
