id: 1066
title: >-
  Board of Selectmen meeting, May 16, 2022 -- a former selectman describes the
  liaison practice
description: >-
  At the May 16, 2022 Board of Selectmen meeting, during a presentation by the
  Economic Development Commission, a former selectman of nine years described
  from her own service how the coordinating work between the board and the
  town's committees used to be done: selectmen assigned themselves as liaisons
  to committees, attended the meetings, and reported back to the board once a
  month with liaison reports. She added, "I find that missing in the Board of
  Selectmen now" (~19:21). She and others proposed quarterly meetings of
  committee chairs to restore the information flow. Her account concerns
  liaisons to town commissions generally.
