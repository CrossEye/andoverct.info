title: >-
  Andover Board of Education / Andover Education Association contract,
  2025-2029
description: >-
  The collective bargaining agreement covering the district's certified staff,
  setting salaries and the structure of insurance and benefits. It defines the
  benefit choices, plan tiers and cost shares that make an aggregate benefit
  figure taken over a small group of named positions reversible to
  individuals.
