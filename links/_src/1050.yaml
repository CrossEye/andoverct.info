id: 1050
title: >-
  Board of Education meeting, June 14, 2023 -- the First Selectman before the
  school board on the community center and the memorandum of understanding
description: >-
  First Selectman Jeff Maguire and Selectwoman Paula King came to the June 14,
  2023 Board of Education meeting for a conversation about the community
  center; the minutes record the chair welcoming them by name. He answered the
  board's written safety questions, then took up the memorandum of
  understanding the board's attorney had drafted. On the record he set out the
  town's position: "The town of Andover is the school district... The town
  owns all the land. The town owns all the buildings. The town is the owner of
  everything. There are no deeded properties to a school or to a board of
  education" (~38:30). Of the memorandum he said "it's not necessary that we
  really do that," while agreeing to review it, and said the town would go to
  planning and zoning and move forward (~39:38). Asked whether the school
  should budget to pave its own upper parking lot, he answered: "It should go
  to CIP... It's a town asset. This building is a town asset" (~54:01), and
  earlier, "It's all town money. I don't split hairs" (~50:58). He also told
  the board he does not tell the Board of Education how to spend its money,
  that he was not going to kill their budget, that he took responsibility for
  not having invited a board member onto the building committee, and he agreed
  to quarterly meetings between the boards. The board chair replied that there
  is a deeded school line on the site-plan map and that the board has
  statutory control of school property (~1:05:04). Official minutes:
  https://www.andoverelementaryct.org/images/boe/Minutes/BOE_Minutes_61423.pdf
