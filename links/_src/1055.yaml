id: 1055
title: >-
  Board of Education meetings, January 11 and February 2, 2023 -- the school
  approves its own solar agreement
description: >-
  On January 11, 2023 the Board of Education voted 7-0 to accept the solar
  power purchase agreement for the elementary school, after reviewing the
  rate, the escalator, the project cost and the twenty-year savings
  (~30:18-58:58). The town was not a party to it, there was no town meeting,
  and no town signature was required. Three weeks later the superintendent
  reported that "Jeff Maguire did do the notarized page that has to go through
  from the town for us to apply for that PPA application," and that the
  February deadline had been met (February 2, 2023, ~9:39).
