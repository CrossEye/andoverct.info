id: 1059
title: >-
  Board of Finance special meeting, August 17, 2023 -- who controls the
  school's capital fund
description: >-
  Three days after the selectmen conditioned the paving permit, the Board of
  Finance held a special meeting to move the money. Asked directly by a Board
  of Education member whether the new fund was the school's or the town's, the
  town administrator answered: the "account is on the town side. The town
  controls that money as it rolls back. It was just designated. It comes back
  into the town and then becomes designated for a capital fund." Pressed
  further -- that it sounded as though the town would be in charge of what it
  was used for, rather than it being a capital account for the school -- he
  answered: "Correct... it's not at the complete discretion of the school"
  (~3:29-3:55 of part 2; the meeting was recorded in two parts, and this entry
  links the part carrying the exchange). Two things the town did in the
  school's favour at the same meeting: it agreed to pay for the materials-
  testing laboratory, the proctor and the monitoring, and to backfill behind
  the curbing at its own cost (part 1, ~15:37); and the finance board convened
  a special meeting on short notice specifically to keep the project moving.
  Part 1 transcript (public speak, the discussion, and the 4-0-1 vote):
  https://andoverct.info/reference/video/transcripts/zHh2bYvxWcI.html
