id: 1029
title: >-
  Board of Finance meeting, July 23, 2025 -- the levy schedule discussed and
  adopted
description: >-
  The recording of the July 23, 2025 Board of Finance meeting, at which the
  board took up the elementary school's levy schedule (agenda item four,
  ~2:35) and adopted it unanimously (~16:36). The finance officer explained
  the board's practice: the district does not submit a broken-out schedule the
  way the regional district does, so the board divides the appropriation into
  equal monthly payments. Asked "Has it always been 10?", the answer on the
  record was that this is "only the third year we did this, because before
  that we just paid their expenses directly. We had a combined checking
  account" (~3:40). Video: https://www.youtube.com/watch?v=6KKKZq0tsr4
url: https://andoverct.info/reference/video/transcripts/6KKKZq0tsr4.html
date: 2025-07-23
