id: 1017
title: >-
  Board of Finance budget meeting, March 4, 2026 -- the preschool's tuition
  basis and costs
description: >-
  At the March 4, 2026 Board of Finance budget meeting the superintendent
  explained the preschool's finances: tuition is $6,000 per child, matching
  the state early-start reimbursement rate and unchanged over her tenure; the
  eight preschool staff salaries are covered by roughly $440,000 of combined
  grant funding plus that tuition; and without the preschool the district
  would still owe mandatory special-education services for those children, an
  estimated $300,000 carried in the general fund with no offsetting tuition,
  because special-education students pay no tuition by law.
