title: "Migration Policy Institute: ICE's detention network, record deaths, and alleged waste"
description: >-
  An analysis from the nonpartisan Migration Policy Institute of the growth of
  ICE detention, reporting 37 deaths in ICE custody in fiscal year 2026 and 60
  since January 2025.
