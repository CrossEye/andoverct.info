id: 312
title: "The Lancet: USAID's effect on mortality and the projected impact of defunding through 2030"
description: >-
  A peer-reviewed study published June 30, 2025, estimating the deaths
  prevented by USAID programs from 2001 to 2021 and projecting more than 14
  million additional deaths by 2030 if the funding cuts continue.
url: https://www.thelancet.com/article/S0140-6736(25)01186-9/fulltext
date: 2025-06-30
