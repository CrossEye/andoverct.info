<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="andoverct.info">
  <!-- Source for /logo.png, the default og:image (1200x630). Regenerate with:
       chrome ..headless ..screenshot=logo.png ..window-size=1200,630 _build/og-logo.svg
       (see the SVG->PNG note: headless Chrome, window size = SVG size) -->
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/>
      <stop offset="1" stop-color="#143862"/>
    </linearGradient>
  </defs>

  <!-- Navy banner background with the site's gold underline, scaled up -->
  <rect width="1200" height="630" fill="url(#banner)"/>
  <rect y="616" width="1200" height="14" fill="#e8a800"/>

  <!-- The favicon mark: navy disc, gold rim, gold A over white CT.
       Original 64x64 art scaled 4.2x, centered at (600, 235). -->
  <g transform="translate(465.6, 100.6) scale(4.2)">
    <circle cx="32" cy="32" r="32" fill="#143862"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#e8a800" stroke-width="1.4" opacity="0.5"/>
    <g font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">
      <text x="32.5" y="55" font-weight="700" font-size="20" letter-spacing="1" fill="#ffffff">CT</text>
      <text x="32" y="42" font-weight="800" font-size="40" fill="#e8a800">A</text>
    </g>
  </g>

  <!-- Site name in the display face (Georgia), white with a gold .INFO -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="78" text-anchor="middle" letter-spacing="5">
    <text x="600" y="500" fill="#ffffff">ANDOVERCT<tspan fill="#e8a800">.INFO</tspan></text>
  </g>
</svg>
